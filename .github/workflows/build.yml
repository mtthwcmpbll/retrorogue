name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    env:
      GODOT_RELEASE: 4.6.2-stable
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install rendering deps (xvfb + software OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgl1 \
            libglx-mesa0 \
            libgl1-mesa-dri \
            libegl1 \
            libegl-mesa0 \
            libglu1-mesa

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}-mono-linux-x86_64

      - name: Install Godot ${{ env.GODOT_RELEASE }} (mono)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          curl -fL -o godot.zip "$url"
          unzip -q godot.zip
          rm godot.zip
          mv "Godot_v${GODOT_RELEASE}_mono_linux_x86_64" godot-mono
          chmod +x "godot-mono/Godot_v${GODOT_RELEASE}_mono_linux.x86_64"

      - name: Expose Godot binary
        run: |
          bin="$HOME/godot/godot-mono/Godot_v${GODOT_RELEASE}_mono_linux.x86_64"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Import project & generate C# glue
        run: |
          # Godot's first headless import on a C# project can exit non-zero
          # while still writing the .godot/ folder and the GodotSharp glue.
          # The second call resolves cleanly once everything is in place.
          "$GODOT_BIN" --headless --import || true
          "$GODOT_BIN" --headless --import

      - name: Build C# project
        # Godot's generated .sln only defines Debug / ExportDebug /
        # ExportRelease (no plain Release), and `godot ... scene.tscn`
        # picks up the Debug assembly when running scenes, so build
        # Debug here to match what the smoke test will load.
        run: dotnet build --configuration Debug --no-restore

      - name: Run scene smoke test
        run: |
          # Loads the real Main.tscn under a software OpenGL context,
          # samples viewport pixels, and asserts the map area renders
          # multiple distinct colors. A solid-color result (the
          # symptom of a broken canvas_item shader) fails the build.
          #
          # gl_compatibility + opengl3 lets us run on llvmpipe without
          # needing Vulkan in CI; the canvas_item shader is renderer-
          # agnostic so this still exercises shader parse + compile.
          set -euo pipefail
          xvfb-run -a "$GODOT_BIN" \
            --rendering-driver opengl3 \
            --rendering-method gl_compatibility \
            res://tests/SceneSmokeTest.tscn

      - name: Run dotnet tests (if any)
        run: |
          # `dotnet test` against the game project itself errors out because
          # it isn't a test SDK project, so only run it when a *Tests.csproj
          # actually exists. Add one and this step will pick it up.
          mapfile -t test_projects < <(find . -type f \( -name '*.Tests.csproj' -o -name '*Tests.csproj' \) -not -path '*/bin/*' -not -path '*/obj/*')
          if [ "${#test_projects[@]}" -eq 0 ]; then
            echo "No *Tests.csproj projects found; skipping dotnet test."
            exit 0
          fi
          for proj in "${test_projects[@]}"; do
            echo "::group::dotnet test $proj"
            dotnet test "$proj" --configuration Debug --no-build --verbosity normal
            echo "::endgroup::"
          done
